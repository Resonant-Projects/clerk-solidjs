name: "CI setup"
description: "Install pnpm, Node.js and workspace dependencies"

inputs:
  skip-cache:
    description: "Skip dependency and turbo caches (release jobs set this to avoid cache poisoning)"
    required: false
    default: "false"
  ignore-scripts:
    description: "Install without running dependency lifecycle scripts (the publish job sets this)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Cache turbo
      if: inputs.skip-cache != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".node-version"
        package-manager-cache: ${{ inputs.skip-cache != 'true' }}
        cache: ${{ inputs.skip-cache != 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
