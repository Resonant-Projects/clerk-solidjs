name: Feature Request
description: Propose a new feature for the SDK.
body:
  - type: markdown
    attributes:
      value: |
        This template is to propose new features for the SDK. If you need help with your own project, open an issue with your question in [our issue tracker](https://github.com/Resonant-Projects/clerk-solidjs/issues).
  - type: textarea
    attributes:
      label: Feature Description
      description: A detailed description of the feature you are proposing for the SDK.
      placeholder: |
        Feature description...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use Case
      description: Provide a use case where this feature would be beneficial
      placeholder: |
        Use case...
  - type: textarea
    attributes:
      label: Additional context
      description: |
        Any extra information that might help us understand your feature request.
      placeholder: |
        Additional context...
