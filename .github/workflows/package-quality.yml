name: Package Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Publint
            script: publint
          - name: ATTW
            script: attw
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Build package
        run: pnpm --filter @resonant-projects/clerk-solidjs run build

      - name: Run ${{ matrix.script }}
        run: pnpm --filter @resonant-projects/clerk-solidjs run ${{ matrix.script }}
