name: Package Preview

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkg-pr-new:
    name: pkg.pr.new preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Build package
        run: pnpm --filter @resonant-projects/clerk-solidjs run build

      - name: Publish preview
        run: pnpm dlx pkg-pr-new publish --compact --pnpm "./packages/clerk-solidjs"
