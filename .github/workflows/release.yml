# Versions and publishes packages with Changesets and npm trusted publishing (OIDC).
# The version job opens the Version Packages PR with a GitHub App token (secrets RELEASE_APP_ID and
# RELEASE_APP_PRIVATE_KEY; see docs/CONTRIBUTING.md) so that CI runs on that PR.
# Only the publish job receives `id-token: write`; it never builds or runs repo scripts.
# Publishing stays off until the repository variable NPM_PUBLISH_ENABLED is "true"
# (see docs/PUBLISH.md for the one-time npm bootstrap).
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          skip-cache: true
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Version Packages PR is committed and opened with a GitHub App token, not GITHUB_TOKEN:
    # GitHub never starts workflow runs for events that GITHUB_TOKEN creates, so a PR opened with
    # it gets no CI. The job itself only needs to read the repository.
    permissions:
      contents: read
    steps:
      - name: Require the release App secrets
        shell: bash
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          missing=0
          for name in RELEASE_APP_ID RELEASE_APP_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret ${name} is empty. The Version Packages PR is opened with the release GitHub App so that CI runs on it; this job does not fall back to GITHUB_TOKEN. See \"Release GitHub App\" in docs/CONTRIBUTING.md."
              missing=1
            fi
          done
          exit "$missing"
      - name: Create the release App token
        id: release-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # commit version changes
          permission-pull-requests: write # open or update the Version Packages PR
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          skip-cache: true
      - name: Create or update the Version Packages PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.release-app-token.outputs.token }}
          script: pnpm run version

  pack:
    name: Build & pack
    if: needs.select-mode.outputs.mode == 'publish' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          skip-cache: true
      - name: Verify
        run: pnpm run prerelease
      - name: Build
        run: pnpm exec turbo build --filter=./packages/*
      - name: Pack
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # push release tags and GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          skip-cache: true
          ignore-scripts: true
      - name: Publish packed tarballs
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
