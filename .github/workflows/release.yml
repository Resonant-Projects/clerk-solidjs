# Versions and publishes packages with Changesets and npm trusted publishing (OIDC).
# Only the publish job receives `id-token: write`; it never builds or runs repo scripts.
# Publishing stays off until the repository variable NPM_PUBLISH_ENABLED is "true"
# (see docs/PUBLISH.md for the one-time npm bootstrap).
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          skip-cache: true
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit version changes
      pull-requests: write # open or update the Version Packages PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          skip-cache: true
      - name: Create or update the Version Packages PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version

  pack:
    name: Build & pack
    if: needs.select-mode.outputs.mode == 'publish' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          skip-cache: true
      - name: Verify
        run: pnpm run prerelease
      - name: Build
        run: pnpm exec turbo build --filter=./packages/*
      - name: Pack
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # push release tags and GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          skip-cache: true
          ignore-scripts: true
      # TEMPORARY: diagnoses the 404 from the first trusted publish. Prints the OIDC claims npm
      # matches against and npm's token-exchange response; every token is masked. Remove after.
      - name: Diagnose npm OIDC exchange
        continue-on-error: true
        shell: bash
        run: |
          echo "node $(node --version), npm $(npm --version), pnpm $(pnpm --version)"
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          echo "::add-mask::$id_token"
          payload=$(cut -d. -f2 <<<"$id_token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          echo "OIDC claims:"
          base64 -d <<<"$payload" | jq '{sub, repository, repository_owner, workflow_ref, job_workflow_ref, environment, ref, event_name, runner_environment}'
          status=$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@resonant-projects%2Fclerk-solidjs")
          token=$(jq -r '.token // empty' exchange.json 2>/dev/null || true)
          if [[ -n "$token" ]]; then echo "::add-mask::$token"; fi
          echo "Token exchange HTTP status: $status"
          jq 'del(.token)' exchange.json 2>/dev/null || cat exchange.json
          rm -f exchange.json
      - name: Publish packed tarballs
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
