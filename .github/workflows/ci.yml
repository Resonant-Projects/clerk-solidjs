name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
      - name: Build
        run: pnpm run build
      - name: Check dist
        # exports paths exist, and `.` and `./start` share one copy of the
        # Clerk contexts under the browser, node and solid conditions.
        run: pnpm --filter @resonant-projects/clerk-solidjs run check:dist
      - name: Test
        run: pnpm run test

  oldest-node:
    # The oldest Node.js `engines` allows. Its Response differs from newer
    # releases'. jsdom needs a newer Node, so only the server tests run here.
    name: Server on Node 22.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          node-version: "22.12"
      - name: Build
        run: pnpm --filter @resonant-projects/clerk-solidjs run build
      - name: Check dist
        run: pnpm --filter @resonant-projects/clerk-solidjs run check:dist
      - name: Test
        run: pnpm --filter @resonant-projects/clerk-solidjs exec vitest run --project node

  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Prettier
            script: format:check
          - name: ESLint
            script: lint
          - name: TypeScript
            script: type-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI setup
        uses: ./.github/actions/ci-setup
      - name: Run ${{ matrix.script }}
        run: pnpm run ${{ matrix.script }}
